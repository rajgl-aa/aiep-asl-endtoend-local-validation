[pytest]
# Behavioral GA-validation suite. Markers are also registered in conftest.py's
# pytest_configure so `-m` filtering works and unknown-marker warnings stay off.
addopts = -ra
markers =
    needs_live_env: requires a live service/credential absent in this env (skip != pass)
    adversarial: negative / injection / off-policy / exfiltration case
    isolation: cross-tenant / cross-layer isolation case
    failure_injection: dependency-down; asserts fail-closed vs fail-open
